<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数式 グラフ プロット ビジュアライザ</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">
<header class="bg-gray-800 px-4 py-3 shadow">
  <h1 class="text-xl font-bold text-cyan-400">数式グラフ プロット ビジュアライザ</h1>
</header>
<main class="flex flex-1 gap-4 p-4 overflow-hidden" style="height:calc(100vh - 56px)">
  <!-- 左パネル -->
  <aside class="w-80 flex flex-col gap-3 overflow-y-auto" aria-label="設定パネル">
    <section aria-labelledby="func-heading" class="bg-gray-800 rounded-lg p-3">
      <h2 id="func-heading" class="text-sm font-semibold text-cyan-300 mb-2">数式入力（最大5本）</h2>
      <div id="func-list" class="flex flex-col gap-2"></div>
      <button id="add-func-btn"
        class="mt-2 w-full text-xs bg-cyan-700 hover:bg-cyan-600 rounded px-2 py-1 transition"
        aria-label="数式を追加">＋ 数式を追加</button>
    </section>

    <section aria-labelledby="range-heading" class="bg-gray-800 rounded-lg p-3">
      <h2 id="range-heading" class="text-sm font-semibold text-cyan-300 mb-2">表示範囲</h2>
      <label class="text-xs text-gray-300">X 範囲: <span id="xmin-val">-10</span> ～ <span id="xmax-val">10</span></label>
      <input type="range" id="xmin" min="-50" max="0" value="-10" step="0.5"
        class="w-full accent-cyan-400" aria-label="X軸最小値">
      <input type="range" id="xmax" min="0" max="50" value="10" step="0.5"
        class="w-full accent-cyan-400 mt-1" aria-label="X軸最大値">
      <label class="text-xs text-gray-300 mt-2 block">Y 範囲: <span id="ymin-val">-10</span> ～ <span id="ymax-val">10</span></label>
      <input type="range" id="ymin" min="-50" max="0" value="-10" step="0.5"
        class="w-full accent-cyan-400" aria-label="Y軸最小値">
      <input type="range" id="ymax" min="0" max="50" value="10" step="0.5"
        class="w-full accent-cyan-400 mt-1" aria-label="Y軸最大値">
    </section>

    <section aria-labelledby="help-heading" class="bg-gray-800 rounded-lg p-3">
      <h2 id="help-heading" class="text-sm font-semibold text-cyan-300 mb-1">使用可能な関数</h2>
      <p class="text-xs text-gray-400 leading-relaxed">
        sin(x) cos(x) tan(x) exp(x) log(x) sqrt(x) abs(x) pow(x,n) PI E<br>
        例: sin(x)*2 / exp(-x*x) / x*x-3*x+1
      </p>
    </section>

    <div class="flex gap-2">
      <button id="save-btn"
        class="flex-1 text-xs bg-green-700 hover:bg-green-600 rounded px-2 py-1 transition"
        aria-label="設定を保存">保存</button>
      <button id="reset-btn"
        class="flex-1 text-xs bg-red-800 hover:bg-red-700 rounded px-2 py-1 transition"
        aria-label="設定をリセット">リセット</button>
    </div>
  </aside>

  <!-- Canvas エリア -->
  <div class="flex-1 relative bg-gray-950 rounded-lg overflow-hidden" id="canvas-wrap">
    <canvas id="main-canvas" class="w-full h-full" role="img" aria-label="数式グラフ表示エリア"></canvas>
    <div id="tooltip"
      class="absolute hidden bg-gray-800 border border-cyan-500 text-xs text-cyan-200 px-2 py-1 rounded pointer-events-none"
      aria-live="polite" aria-label="座標ツールチップ"></div>
  </div>
</main>

<script>
(function() {
  'use strict';

  const COLORS = ['#00e5ff','#ff4081','#76ff03','#ff9100','#d500f9'];
  const STORAGE_KEY = 'graphPlotState_v1';

  let state = {
    funcs: [
      { expr: 'sin(x)', color: COLORS[0], visible: true },
    ],
    xmin: -10, xmax: 10,
    ymin: -10, ymax: 10,
  };

  /* ---------- DOM refs ---------- */
  const canvas = document.getElementById('main-canvas');
  const ctx = canvas.getContext('2d');
  const tooltip = document.getElementById('tooltip');
  const funcList = document.getElementById('func-list');
  const wrap = document.getElementById('canvas-wrap');

  /* ---------- Storage ---------- */
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
  }
  function load() {
    try {
      const d = localStorage.getItem(STORAGE_KEY);
      if (d) {
        const parsed = JSON.parse(d);
        if (parsed && Array.isArray(parsed.funcs)) state = parsed;
      }
    } catch(e) {}
  }

  /* ---------- Safe eval ---------- */
  function buildFn(expr) {
    // sanitize: allow only safe math chars
    const safe = /^[0-9x+\-*/^().,\s_a-zA-Z]+$/.test(expr);
    if (!safe) return null;
    try {
      // eslint-disable-next-line no-new-func
      const fn = new Function('x','Math',
        `"use strict"; try { return (${expr.replace(/\^/g,'**')}); } catch(e){ return NaN; }`
      );
      return (x) => fn(x, Math);
    } catch(e) { return null; }
  }

  /* ---------- Canvas resize ---------- */
  function resize() {
    canvas.width = wrap.clientWidth;
    canvas.height = wrap.clientHeight;
    draw();
  }

  /* ---------- World <-> Canvas ---------- */
  function wx(worldX) {
    return (worldX - state.xmin) / (state.xmax - state.xmin) * canvas.width;
  }
  function wy(worldY) {
    return (1 - (worldY - state.ymin) / (state.ymax - state.ymin)) * canvas.height;
  }
  function cxToWorld(cx) {
    return state.xmin + (cx / canvas.width) * (state.xmax - state.xmin);
  }
  function cyToWorld(cy) {
    return state.ymax - (cy / canvas.height) * (state.ymax - state.ymin);
  }

  /* ---------- Draw ---------- */
  function draw() {
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    // Background
    ctx.fillStyle = '#0a0a0f';
    ctx.fillRect(0, 0, W, H);

    drawGrid(W, H);
    drawAxes(W, H);

    state.funcs.forEach((f, i) => {
      if (!f.visible) return;
      const fn = buildFn(f.expr);
      if (!fn) return;
      drawFunction(fn, f.color, W, H);
    });

    drawLegend(W, H);
  }

  function niceStep(range) {
    const rough = range / 8;
    const p = Math.pow(10, Math.floor(Math.log10(rough)));
    const steps = [1,2,2.5,5,10];
    for (const s of steps) if (s * p >= rough) return s * p;
    return p * 10;
  }

  function drawGrid(W, H) {
    const xRange = state.xmax - state.xmin;
    const yRange = state.ymax - state.ymin;
    const xStep = niceStep(xRange);
    const yStep = niceStep(yRange);

    ctx.strokeStyle = '#1e2a3a';
    ctx.lineWidth = 1;
    ctx.setLineDash([2,4]);

    // vertical
    const xStart = Math.ceil(state.xmin / xStep) * xStep;
    for (let x = xStart; x <= state.xmax + xStep * 0.01; x += xStep) {
      const cx = wx(x);
      ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, H); ctx.stroke();
    }
    // horizontal
    const yStart = Math.ceil(state.ymin / yStep) * yStep;
    for (let y = yStart; y <= state.ymax + yStep * 0.01; y += yStep) {
      const cy = wy(y);
      ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(W, cy); ctx.stroke();
    }
    ctx.setLineDash([]);

    // labels
    ctx.fillStyle = '#4a6070';
    ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    for (let x = xStart; x <= state.xmax + xStep * 0.01; x += xStep) {
      const cx = wx(x);
      const label = parseFloat(x.toFixed(4)).toString();
      ctx.fillText(label, cx, Math.min(wy(0) + 14, H - 4));
    }
    ctx.textAlign = 'right';
    for (let y = yStart; y <= state.ymax + yStep * 0.01; y += yStep) {
      if (Math.abs(y) < yStep * 0.001) continue;
      const cy = wy(y);
      const label = parseFloat(y.toFixed(4)).toString();
      ctx.fillText(label, Math.max(wx(0) - 4, 30), cy + 3);
    }
  }

  function drawAxes(W, H) {
    ctx.strokeStyle = '#607d8b';
    ctx.lineWidth = 1.5;
    // X axis
    const y0 = wy(0);
    if (y0 >= 0 && y0 <= H) {
      ctx.beginPath(); ctx.moveTo(0, y0); ctx.lineTo(W, y0); ctx.stroke();
    }
    // Y axis
    const x0 = wx(0);
    if (x0 >= 0 && x0 <= W) {
      ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(x0, H); ctx.stroke();
    }
    // Axis labels
    ctx.fillStyle = '#90a4ae';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('x', W - 14, Math.max(Math.min(y0 - 4, H - 14), 14));
    ctx.textAlign = 'center';
    ctx.fillText('y', Math.max(Math.min(x0 + 8, W - 14), 14), 14);
  }

  function drawFunction(fn, color, W, H) {
    const steps = W * 2;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    let penDown = false;
    let prevY = null;
    for (let i = 0; i <= steps; i++) {
      const worldX = state.xmin + (i / steps) * (state.xmax - state.xmin);
      let worldY = fn(worldX);
      if (!isFinite(worldY) || isNaN(worldY)) { penDown = false; prevY = null; continue; }
      // discontinuity detection
      if (prevY !== null && Math.abs(worldY - prevY) > (state.ymax - state.ymin) * 3) {
        penDown = false;
      }
      prevY = worldY;
      const cx = wx(worldX);
      const cy = wy(worldY);
      if (!penDown) { ctx.moveTo(cx, cy); penDown = true; }
      else ctx.lineTo(cx, cy);
    }
    ctx.stroke();
  }

  function drawLegend(W, H) {
    const visible = state.funcs.filter(f => f.visible && f.expr.trim());
    if (!visible.length) return;
    const pad = 8, lineH = 18, boxW = 160;
    const boxH = pad * 2 + visible.length * lineH;
    const bx = W - boxW - 8, by = 8;
    ctx.fillStyle = 'rgba(10,10,20,0.75)';
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(bx, by, boxW, boxH, 4);
    ctx.fill(); ctx.stroke();

    visible.forEach((f, i) => {
      const y = by + pad + i * lineH + lineH / 2;
      ctx.strokeStyle = f.color;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(bx + 8, y); ctx.lineTo(bx + 28, y); ctx.stroke();
      ctx.fillStyle = '#e0e0e0';
      ctx.font = '11px monospace';
      ctx.textAlign = 'left';
      const label = f.expr.length > 16 ? f.expr.slice(0, 14) + '…' : f.expr;
      ctx.fillText(label, bx + 34, y + 4);
    });
  }

  /* ---------- Crosshair / Tooltip ---------- */
  let mousePos = null;
  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const cx = (e.clientX - rect.left) * scaleX;
    const cy = (e.clientY - rect.top) * scaleY;
    mousePos = { cx, cy };

    const wx_ = cxToWorld(cx);
    const wy_ = cyToWorld(cy);

    // tooltip
    tooltip.style.left = (e.clientX - rect.left + 12) + 'px';
    tooltip.style.top = (e.clientY - rect.top - 28) + 'px';
    const lines = [`x = ${wx_.toFixed(3)}`];
    state.funcs.forEach(f => {
      if (!f.visible || !f.expr.trim()) return;
      const fn = buildFn(f.expr);
      if (!fn) return;
      const yv = fn(wx_);
      if (isFinite(yv)) lines.push(`${f.expr.slice(0,12)} = ${yv.toFixed(3)}`);
    });
    tooltip.classList.remove('hidden');
    // Use textContent for each line (no innerHTML)
    while (tooltip.firstChild) tooltip.removeChild(tooltip.firstChild);
    lines.forEach((l, i) => {
      const d = document.createElement('div');
      d.textContent = l;
      if (i === 0) d.style.color = '#94a3b8';
      tooltip.appendChild(d);
    });

    drawWithCrosshair(cx, cy);
  });

  canvas.addEventListener('mouseleave', () => {
    mousePos = null;
    tooltip.classList.add('hidden');
    draw();
  });

  function drawWithCrosshair(cx, cy) {
    draw();
    ctx.strokeStyle = 'rgba(200,200,200,0.3)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(canvas.width, cy); ctx.stroke();
    ctx.setLineDash([]);
    // dot on each curve
    const wx_ = cxToWorld(cx);
    state.funcs.forEach(f => {
      if (!f.visible || !f.expr.trim()) return;
      const fn = buildFn(f.expr);
      if (!fn) return;
      const yv = fn(wx_);
      if (!isFinite(yv)) return;
      const dotY = wy(yv);
      ctx.fillStyle = f.color;
      ctx.beginPath();
      ctx.arc(cx, dotY, 4, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  /* ---------- UI building ---------- */
  function buildFuncRow(f, idx) {
    const row = document.createElement('div');
    row.className = 'flex items-center gap-1';
    row.setAttribute('role', 'group');
    row.setAttribute('aria-label', `数式 ${idx + 1}`);

    // color picker
    const colorInput = document.createElement('input');
    colorInput.type = 'color';
    colorInput.value = f.color;
    colorInput.className = 'w-7 h-7 rounded cursor-pointer border-0 bg-transparent';
    colorInput.setAttribute('aria-label', `数式${idx + 1}の色`);
    colorInput.addEventListener('input', () => {
      state.funcs[idx].color = colorInput.value;
      draw();
    });

    // text input
    const textInput = document.createElement('input');
    textInput.type = 'text';
    textInput.value = f.expr;
    textInput.className = 'flex-1 bg-gray-700 text-xs text-gray-100 rounded px-2 py-1 font-mono border border-gray-600 focus:border-cyan-500 focus:outline-none';
    textInput.setAttribute('aria-label', `数式${idx + 1}の式`);
    textInput.setAttribute('placeholder', 'sin(x)');
    textInput.addEventListener('input', () => {
      state.funcs[idx].expr = textInput.value;
      draw();
    });

    // visible toggle
    const visBtn = document.createElement('button');
    visBtn.textContent = f.visible ? '👁' : '🚫';
    visBtn.className = 'text-sm w-7 h-7 rounded hover:bg-gray-700 transition';
    visBtn.setAttribute('aria-label', `数式${idx + 1}の表示切替`);
    visBtn.addEventListener('click', () => {
      state.funcs[idx].visible = !state.funcs[idx].visible;
      visBtn.textContent = state.funcs[idx].visible ? '👁' : '🚫';
      draw();
    });

    // delete
    const delBtn = document.createElement('button');
    delBtn.textContent = '✕';
    delBtn.className = 'text-xs w-6 h-6 rounded bg-red-900 hover:bg-red-700 transition';
    delBtn.setAttribute('aria-label', `数式${idx + 1}を削除`);
    delBtn.addEventListener('click', () => {
      state.funcs.splice(idx, 1);
      renderFuncList();
      draw();
    });

    row.appendChild(colorInput);
    row.appendChild(textInput);
    row.appendChild(visBtn);
    if (state.funcs.length > 1) row.appendChild(delBtn);

    return row;
  }

  function renderFuncList() {
    while (funcList.firstChild) funcList.removeChild(funcList.firstChild);
    state.funcs.forEach((f, i) => funcList.appendChild(buildFuncRow(f, i)));
  }

  /* ---------- Range sliders ---------- */
  function bindSlider(id, valId, stateKey) {
    const el = document.getElementById(id);
    const val = document.getElementById(valId);
    el.value = state[stateKey];
    val.textContent = state[stateKey];
    el.addEventListener('input', () => {
      state[stateKey] = parseFloat(el.value);
      val.textContent = el.value;
      draw();
    });
  }

  bindSlider('xmin', 'xmin-val', 'xmin');
  bindSlider('xmax', 'xmax-val', 'xmax');
  bindSlider('ymin', 'ymin-val', 'ymin');
  bindSlider('ymax', 'ymax-val', 'ymax');

  /* ---------- Buttons ---------- */
  document.getElementById('add-func-btn').addEventListener('click', () => {
    if (state.funcs.length >= 5) return;
    state.funcs.push({ expr: '', color: COLORS[state.funcs.length % COLORS.length], visible: true });
    renderFuncList();
  });

  document.getElementById('save-btn').addEventListener('click', () => {
    save();
    const btn = document.getElementById('save-btn');
    btn.textContent = '保存済み✓';
    setTimeout(() => { btn.textContent = '保存'; }, 1500);
  });

  document.getElementById('reset-btn').addEventListener('click', () => {
    if (!confirm('設定をリセットしますか？')) return;
    localStorage.removeItem(STORAGE_KEY);
    state = {
      funcs: [{ expr: 'sin(x)', color: COLORS[0], visible: true }],
      xmin: -10, xmax: 10, ymin: -10, ymax: 10,
    };
    ['xmin','xmax','ymin','ymax'].forEach(k => {
      document.getElementById(k).value = state[k];
      document.getElementById(k + '-val').textContent = state[k];
    });
    renderFuncList();
    draw();
  });

  /* ---------- Keyboard ---------- */
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    const step = (state.xmax - state.xmin) * 0.1;
    if (e.key === 'ArrowLeft') { state.xmin -= step; state.xmax -= step; draw(); }
    if (e.key === 'ArrowRight') { state.xmin += step; state.xmax += step; draw(); }
    if (e.key === 'ArrowUp') { state.ymin += step; state.ymax += step; draw(); }
    if (e.key === 'ArrowDown') { state.ymin -= step; state.ymax -= step; draw(); }
  });

  /* ---------- Init ---------- */
  load();
  renderFuncList();
  // sync sliders after load
  ['xmin','xmax','ymin','ymax'].forEach(k => {
    document.getElementById(k).value = state[k];
    document.getElementById(k + '-val').textContent = state[k];
  });
  resize();

  const ro = new ResizeObserver(resize);
  ro.observe(wrap);
})();
</script>
</body>
</html>
